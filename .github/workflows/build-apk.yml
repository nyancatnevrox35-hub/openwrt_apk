name: Build OpenWrt apk packages

# 云端编译 ruijie_auth 与 luci-app-ruijie_auth,产出 .apk 包。
# 使用 ImmortalWrt 快照 SDK(已切换到 apk 包管理器),目标架构默认 mediatek/filogic
# (MediaTek MT7981 / Filogic 820,如 Cudy TR3000,包架构 aarch64_cortex-a53)。

on:
  push:
    branches: [ main ]
    paths:
      - 'ruijie_auth.c'
      - 'openwrt/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      target:
        description: '目标平台 (Target),如 mediatek'
        required: false
        default: 'mediatek'
      subtarget:
        description: '子目标 (Subtarget),如 filogic'
        required: false
        default: 'filogic'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET: ${{ github.event.inputs.target || 'mediatek' }}
      SUBTARGET: ${{ github.event.inputs.subtarget || 'filogic' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk gettext \
            unzip file python3 zstd flex bison libssl-dev git rsync

      - name: Resolve SDK URL
        id: sdk
        run: |
          BASE="https://downloads.immortalwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          NAME="$(curl -fsSL "$BASE/" | grep -oE 'href="immortalwrt-sdk-[^"]+\.tar\.zst"' | head -n1 | sed -E 's/^href="//; s/"$//')"
          [ -n "$NAME" ] || { echo "SDK not found at $BASE"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "url=$BASE/$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved SDK: $NAME"

      - name: Download SDK
        run: curl -fL --retry 3 -o sdk.tar.zst "${{ steps.sdk.outputs.url }}"

      - name: Extract SDK
        run: |
          mkdir -p sdk
          tar -C sdk --strip-components=1 -xf sdk.tar.zst
          rm -f sdk.tar.zst
          echo "SDK extracted:"
          ls sdk | head -n 20

      - name: Build ruijie_auth
        working-directory: sdk
        run: |
          cp -r "$GITHUB_WORKSPACE/openwrt/ruijie_auth" package/ruijie_auth
          # 新包不在 .config 中,需显式选中并用非交互的 defconfig 刷新 .config,
          # 否则 make 会尝试调用交互式 menuconfig(CI 无 TTY 会报 "Error opening terminal")
          echo 'CONFIG_PACKAGE_ruijie_auth=m' >> .config
          make defconfig
          make package/ruijie_auth/compile V=s

      - name: Build luci-app-ruijie_auth
        working-directory: sdk
        run: |
          # 更新 base / luci / packages 三个 feed:
          #   - luci feed     提供 luci.mk 与 luci-base / luci-lib-* 等 Lua 库
          #   - packages feed 提供 luasrcdiet(luci.mk 的构建依赖)与 cgi-io
          #   - base feed(immortalwrt 主仓库 package/)提供 lua / ucode / rpcd / libubus
          #     等运行时依赖。此前未更新 base,导致这些包不在索引里,
          #     lucihttp 的 lua 绑定找不到 lua.h 而编译失败
          ./scripts/feeds update base luci packages
          # 放入应用并重建索引(仅重建上述三个 feed,避免其它未下载 feed 的 find 噪音)
          cp -r "$GITHUB_WORKSPACE/openwrt/luci-app-ruijie_auth" feeds/luci/applications/luci-app-ruijie_auth
          ./scripts/feeds update -i base luci packages
          # feeds install 会递归解析 builddepends/host 与运行时 depends,
          # 自动安装 lua / luasrcdiet / rpcd / ucode / cgi-io / liblucihttp-ucode 等
          ./scripts/feeds install -f luci-app-ruijie_auth luci-base luasrcdiet
          make defconfig
          # 直接编译目标包,依赖链会按正确顺序自动构建(无需手动编译 lua/ucode)
          make package/luci-app-ruijie_auth/compile -j$(nproc) V=s

      - name: Collect packages
        run: |
          mkdir -p dist
          find sdk/bin -type f -name '*.apk' -exec cp -v {} dist/ \;
          echo "--- built packages ---"
          ls -la dist/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ruijie-auth-${{ env.TARGET }}-${{ env.SUBTARGET }}-apk
          path: dist/
          if-no-files-found: error
