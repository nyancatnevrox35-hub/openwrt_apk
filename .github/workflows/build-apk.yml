name: Build OpenWrt apk packages

# 云端编译 ruijie_auth 与 luci-app-ruijie_auth,产出 .apk 包。
# 使用 ImmortalWrt 快照 SDK(已切换到 apk 包管理器),目标架构默认 mediatek/filogic
# (MediaTek MT7981 / Filogic 820,如 Cudy TR3000,包架构 aarch64_cortex-a53)。

on:
  push:
    branches: [ main ]
    paths:
      - 'ruijie_auth.c'
      - 'openwrt/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      target:
        description: '目标平台 (Target),如 mediatek'
        required: false
        default: 'mediatek'
      subtarget:
        description: '子目标 (Subtarget),如 filogic'
        required: false
        default: 'filogic'
      create_release:
        description: '创建 GitHub Release 并附带 .apk'
        type: boolean
        required: false
        default: false
      release_tag:
        description: 'Release 版本号(创建 Release 时使用)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

env:
  TARGET: ${{ github.event.inputs.target || 'mediatek' }}
  SUBTARGET: ${{ github.event.inputs.subtarget || 'filogic' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev gawk gettext \
            unzip file python3 zstd flex bison libssl-dev git rsync

      - name: Resolve SDK URL
        id: sdk
        run: |
          BASE="https://downloads.immortalwrt.org/snapshots/targets/${TARGET}/${SUBTARGET}"
          NAME="$(curl -fsSL "$BASE/" | grep -oE 'href="immortalwrt-sdk-[^"]+\.tar\.zst"' | head -n1 | sed -E 's/^href="//; s/"$//')"
          [ -n "$NAME" ] || { echo "SDK not found at $BASE"; exit 1; }
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "url=$BASE/$NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved SDK: $NAME"

      - name: Download SDK
        run: curl -fL --retry 3 -o sdk.tar.zst "${{ steps.sdk.outputs.url }}"

      - name: Extract SDK
        run: |
          mkdir -p sdk
          tar -C sdk --strip-components=1 -xf sdk.tar.zst
          rm -f sdk.tar.zst
          echo "SDK extracted:"
          ls sdk | head -n 20

      - name: Build ruijie_auth (daemon + LuCI GUI, single apk)
        working-directory: sdk
        run: |
          # 更新 base / luci / packages 三个 feed:
          #   - luci feed     提供 luci-base 及其 host 工具 po2lmo(编译 .lmo 用)
          #   - packages feed 提供 luasrcdiet 等依赖
          #   - base feed     提供 lua / ucode / rpcd / libubus 等运行时依赖
          ./scripts/feeds update base luci packages
          # 放入单包(整合守护进程 + LuCI 界面 + 中英翻译)
          cp -r "$GITHUB_WORKSPACE/openwrt/ruijie_auth" package/ruijie_auth
          ./scripts/feeds update -i base luci packages
          # feeds install 会递归解析 builddepends/host 与运行时 depends,
          # 自动安装 lua / luasrcdiet / rpcd / ucode / cgi-io / liblucihttp-ucode 等
          ./scripts/feeds install -f luci-base luasrcdiet
          # 新包不在 .config 中,需显式选中并用非交互的 defconfig 刷新 .config,
          # 否则 make 会尝试调用交互式 menuconfig(CI 无 TTY 会报 "Error opening terminal")
          echo 'CONFIG_PACKAGE_ruijie_auth=m' >> .config
          make defconfig
          # 直接编译目标包,依赖链(含 luci-base/host 的 po2lmo)会按正确顺序自动构建
          make package/ruijie_auth/compile -j$(nproc) V=s

      - name: Collect packages
        run: |
          mkdir -p dist
          find sdk/bin -type f -name '*.apk' -exec cp -v {} dist/ \;
          echo "--- built packages ---"
          ls -la dist/

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ruijie-auth-${{ env.TARGET }}-${{ env.SUBTARGET }}-apk
          path: dist/
          if-no-files-found: error

      - name: Build APK feed (packages.adb index)
        shell: bash
        run: |
          set -e
          APK="$GITHUB_WORKSPACE/sdk/staging_dir/host/bin/apk"
          FEED="$GITHUB_WORKSPACE/feed/${TARGET}/${SUBTARGET}"
          mkdir -p "$FEED"
          find sdk/bin -type f -name '*.apk' -exec cp -v "{}" "$FEED/" ';'
          ls -la "$FEED/"
          cd "$FEED"
          "$APK" mkndx --root "$GITHUB_WORKSPACE/sdk" --keys-dir "$GITHUB_WORKSPACE/sdk" --allow-untrusted --output packages.adb *.apk
          echo "--- feed ---"
          ls -la "$FEED/"

      - name: Deploy APK feed to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./feed
          publish_branch: gh-pages
          keep_files: true
          force_orphan: false
          commit_message: "feed: ${{ env.TARGET }}/${{ env.SUBTARGET }}"
          user_name: nyancatnevrox35-hub
          user_email: nyancatnevrox35-hub@users.noreply.github.com

  release:
    needs: build
    if: github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built apk
        uses: actions/download-artifact@v4
        with:
          name: ruijie-auth-${{ env.TARGET }}-${{ env.SUBTARGET }}-apk
          path: apk/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || 'v1.0.0' }}
          name: ruijie-auth ${{ github.event.inputs.release_tag || 'v1.0.0' }}
          files: apk/*.apk
          generate_release_notes: true
